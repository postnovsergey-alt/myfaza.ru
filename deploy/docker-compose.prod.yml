name: myfaza-prod

# Прод-конфиг. Отличается от корневого docker-compose.yml:
# — без bind-mount живого кода и --reload
# — образы под конкретный TAG (публикует CI)
# — контейнеры бота и воркера отдельно
# — Nginx фронтом, TLS через сертификаты, смонтированные из /etc/letsencrypt
# — worker и bot запускаются в единственном экземпляре (шедулер не должен
#   дублироваться, ТЗ 12.3)

x-app-image: &app_image
  image: ghcr.io/${GH_ORG:-myfaza}/myfaza-api:${TAG:-latest}
  restart: unless-stopped
  env_file: /etc/myfaza/.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfaza}
      POSTGRES_USER: ${POSTGRES_USER:-myfaza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myfaza}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Не публикуем порт наружу — доступ только из docker-сети
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    <<: *app_image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --workers 2
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  bot:
    <<: *app_image
    # webhook-режим — приём апдейтов через /api/v1/telegram/webhook на api,
    # поэтому отдельного контейнера-бота в MVP можно не поднимать. Но
    # держим отдельный сервис на будущее (polling для staging).
    command: python -c "print('bot placeholder; webhook via api'); import time; time.sleep(31536000)"
    networks: [backend]

  worker:
    <<: *app_image
    # Единственный экземпляр — планировщик уведомлений не должен
    # запускаться дважды (см. DECISIONS.md sprint 5)
    deploy:
      replicas: 1
    command: python -m app.workers.entrypoint
    networks: [backend]

  frontend:
    image: ghcr.io/${GH_ORG:-myfaza}/myfaza-frontend:${TAG:-latest}
    restart: unless-stopped
    networks: [frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [frontend]

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
  frontend:
