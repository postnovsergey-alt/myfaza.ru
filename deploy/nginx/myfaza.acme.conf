# Bootstrap-конфиг для первой выдачи сертификата на общем VPS.
# Ставится один раз, вместо полного myfaza.conf, пока сертификата ещё нет.
# После успешного certbot certonly заменяется на myfaza.conf.
#
# Хостовой nginx уже слушает 80/443 для соседних проектов (zabiru,
# musorstop). Этот server-блок добавляется в /etc/nginx/sites-enabled/
# отдельно и обслуживает только домен myfaza.ru — challenge на 80.

server {
    listen 80;
    listen [::]:80;
    server_name myfaza.ru www.myfaza.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "myfaza.ru bootstrap\n";
        add_header Content-Type text/plain;
    }
}
