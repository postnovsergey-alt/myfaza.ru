# Nginx server-блок для myfaza.ru — под хостовой nginx на общем VPS.
# Кладётся в /etc/nginx/sites-available/myfaza.ru и линкуется в
# /etc/nginx/sites-enabled/. Не трогает конфиги соседних проектов.
#
# Требует выданный certbot-сертификат: /etc/letsencrypt/live/myfaza.ru/*.

# 1) HTTP → HTTPS + ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name myfaza.ru www.myfaza.ru;

    # ACME challenge для certbot (webroot-плагин)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://myfaza.ru$request_uri;
    }
}

# 2) HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name myfaza.ru;

    ssl_certificate     /etc/letsencrypt/live/myfaza.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myfaza.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности (раздел 11.2 ТЗ)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://telegram.org 'unsafe-inline'; connect-src 'self' https://api.telegram.org; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'"
        always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    client_max_body_size 2m;

    root /var/www/myfaza/dist;
    index index.html;

    # SPA — фронт как статика, всё что не найдено → index.html
    location / {
        try_files $uri /index.html;
    }

    # Долгий кеш для собранных ассетов Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — проксируем в uvicorn контейнер на 127.0.0.1:8010
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Service worker — принудительно no-cache (иначе новые версии
    # не подхватываются на возврате пользователя)
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
