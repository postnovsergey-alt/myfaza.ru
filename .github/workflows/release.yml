name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/myfaza-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/myfaza-api:latest
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/myfaza-frontend:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/myfaza-frontend:latest
      - name: Deploy over SSH
        # Требует секретов: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/myfaza
            export TAG=${{ steps.tag.outputs.tag }}
            docker compose -f deploy/docker-compose.prod.yml pull
            docker compose -f deploy/docker-compose.prod.yml up -d
            docker compose -f deploy/docker-compose.prod.yml exec -T api alembic upgrade head
            # smoke test — API должен ответить 200
            for i in $(seq 1 30); do
              if curl -fsS https://myfaza.ru/api/v1/health/ready | grep -q '"status":"ok"'; then
                echo "deploy ok"
                exit 0
              fi
              sleep 2
            done
            echo "smoke test failed — rolling back"
            docker compose -f deploy/docker-compose.prod.yml pull --quiet ghcr.io/${{ github.repository_owner }}/myfaza-api:previous || true
            exit 1
