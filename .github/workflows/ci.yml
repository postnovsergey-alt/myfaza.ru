name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myfaza
          POSTGRES_USER: myfaza
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U myfaza"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      APP_ENV: local
      SECRET_KEY: "tttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt"
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: myfaza
      POSTGRES_USER: myfaza
      POSTGRES_PASSWORD: test
      REDIS_URL: redis://localhost:6379/0
      BOT_TOKEN: "123456:TESTBOTTOKENFORFAKEUSE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 120 --retries 5 -e ".[dev]"
      - name: Alembic upgrade head
        working-directory: backend
        run: alembic upgrade head
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Mypy
        working-directory: backend
        run: mypy app
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle size check
        working-directory: frontend
        run: |
          js=$(find dist/assets -name "index-*.js" | head -n1)
          size=$(stat -c%s "$js")
          echo "index js: ${size} bytes"
          if [ "$size" -gt 262144 ]; then
            echo "bundle > 256 KB — превышает бюджет NFR-3"
            exit 1
          fi
